<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29332C"/>
      <stop offset="1" stop-color="#111512"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FB996" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8FB996" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moss" x1="0" y1="330" x2="0" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8E1BD"/>
      <stop offset="0.5" stop-color="#8FB996"/>
      <stop offset="1" stop-color="#557F5C"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC59F"/>
      <stop offset="1" stop-color="#D6ECCB"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
  <!-- the m and its leaf, nudged down to sit centered without the old ground line -->
  <g transform="translate(0 24)">
  <!-- the m: two moss mounds -->
  <path d="M 294 682 V 494 A 109 109 0 0 1 512 494 V 682 M 512 494 A 109 109 0 0 1 730 494 V 682"
        fill="none" stroke="url(#moss)" stroke-width="92" stroke-linejoin="round"/>
  <!-- a leaf sprouting from the right mound -->
  <g transform="translate(722 392) rotate(-42)">
    <path d="M -6 0 C 30 -46 92 -62 148 -50 C 122 4 58 28 -6 0 Z" fill="url(#leaf)"/>
  </g>
  </g>
</svg>
