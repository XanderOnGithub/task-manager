# Gets a runner ready to build Moss for Android, shared by ci.yml and release.yml:
# Java, the Android SDK and NDK, Rust's Android targets, the front end's
# packages, and the Android project itself.
#
# The Android project (src-tauri/gen/android, a Gradle project) isn't kept in
# the repo: `tauri android init` makes it fresh from tauri.conf.json on every
# build, and `tauri icon` puts the Moss icon into it. So there is nothing
# Android-specific to keep up to date by hand.

name: Android project
description: Sets up the Android toolchain and generates src-tauri/gen/android

inputs:
  rust-targets:
    description: Rust targets to install (comma-separated)
    default: aarch64-linux-android,armv7-linux-androideabi

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm

    # Gradle (Android's build tool) needs Java 17.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # The SDK, with its licenses accepted.
    - uses: android-actions/setup-android@v3

    # The NDK compiles the Rust side (and the C inside some of its crates)
    # for phones. Build tools hold zipalign and apksigner, used to sign the APK.
    - name: Android NDK and build tools
      shell: bash
      run: |
        sdkmanager --install "ndk;27.2.12479018" "build-tools;34.0.0" "platforms;android-34" > /dev/null
        echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
        echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: android

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Make the Android project
      shell: bash
      run: |
        pnpm tauri android init --ci
        # Also rewrites the desktop icons in this throwaway checkout; only the
        # Android ones matter here.
        pnpm tauri icon brand/icon-1024.png
