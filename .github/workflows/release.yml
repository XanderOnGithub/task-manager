# Releases Moss whenever a new version reaches main.
#
# How work flows (see "Branches and releases" in CLAUDE.md):
#   feature/…, fix/…, refactor/…  →  PR into the current release/… branch
#   release/alpha-0.1             →  PR into main when it's ready to ship
#   main                          →  this workflow
#
# On every push to main it reads the version from src-tauri/tauri.conf.json
# (and the stage, e.g. "alpha", from package.json). If that version has
# already been released, it stops. Otherwise it:
#   1. creates a draft release "Moss alpha 0.1.0" with notes made from the PRs,
#   2. builds installers for macOS (Apple silicon + Intel), Windows and Linux
#      and uploads them to it,
#   3. publishes it once every build has succeeded (so a half-built release
#      never shows up).
# So shipping = bump the version on the release branch, merge it into main.
# It can also be run by hand from the Actions tab.
#
# The builds are not code-signed yet: macOS will say the app is from an
# unidentified developer (right-click → Open the first time), and Windows
# SmartScreen will warn. Signing needs certificates; see the README.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Creating a release and uploading files to it.
permissions:
  contents: write

# One release run at a time; a newer push waits for the current one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      release_id: ${{ steps.check.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read the version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          stage=$(node -p "require('./package.json').stage || ''")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "title=Moss ${stage:+$stage }$version" >> "$GITHUB_OUTPUT"
          echo "Version $version ($stage)"

      - id: check
        name: Create the draft release, unless this version is out already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          # A published release with this tag means nothing to do.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released. Bump the version on the release branch to ship a new one."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Leftover drafts for this version (a failed run) are replaced.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            # The oldest supported Ubuntu, so the .deb and AppImage run on more systems.
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-targets }}

      - name: Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      # Builds the front end and the app, bundles installers (.dmg, .msi/.exe,
      # .deb/.rpm/.AppImage) and uploads them to the draft made above.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false
