# Builds installers for macOS, Windows and Linux and attaches them to a
# GitHub Release.
#
# How to release:
#   1. Bump "version" in src-tauri/tauri.conf.json (and package.json / Cargo.toml
#      to match), commit, push.
#   2. Tag that commit and push the tag:   git tag v0.2.0 && git push origin v0.2.0
#   3. This workflow builds on all three systems and creates a *draft* release
#      named after the tag. Check it on GitHub, then press Publish.
# You can also run it by hand from the Actions tab (it uses the version in
# tauri.conf.json for the tag).
#
# The builds are not code-signed yet: macOS will say the app is from an
# unidentified developer (right-click → Open the first time), and Windows
# SmartScreen will warn. Signing needs certificates; see the README.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Creating a release and uploading files to it.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            # The oldest supported Ubuntu, so the .deb and AppImage run on more systems.
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-targets }}

      - name: Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      # Builds the front end and the app, bundles installers (.dmg, .msi/.exe,
      # .deb/.rpm/.AppImage) and uploads them to the draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Task Manager v__VERSION__
          releaseBody: See the commits since the last release for what changed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
