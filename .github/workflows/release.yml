# Releases Moss whenever a new version reaches main.
#
# How work flows (see "Branches and releases" in CLAUDE.md):
#   feature/…, fix/…, refactor/…  →  PR into the current release/… branch
#   release/alpha-0.1             →  PR into main when it's ready to ship
#   main                          →  this workflow
#
# On every push to main it reads the version from src-tauri/tauri.conf.json
# (and the stage, e.g. "alpha", from package.json). If that version has
# already been released, it stops. Otherwise it:
#   1. creates a draft release "Moss alpha 0.1.0" with notes made from the PRs,
#   2. builds installers for macOS (Apple silicon + Intel), Windows and Linux,
#      and an APK for Android, and uploads them to it,
#   3. publishes it once every desktop build has succeeded (so a half-built
#      release never shows up; a failed Android build doesn't hold it back). With the signing key set, it also carries latest.json,
#      which is how installed copies find the update.
# So shipping = bump the version on the release branch, merge it into main.
# It can also be run by hand from the Actions tab.
#
# The builds are not code-signed yet: macOS will say the app is from an
# unidentified developer (right-click → Open the first time), and Windows
# SmartScreen will warn. Signing needs certificates; see the README.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Creating a release and uploading files to it.
permissions:
  contents: write

# One release run at a time; a newer push waits for the current one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      release_id: ${{ steps.check.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        name: Read the version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          stage=$(node -p "require('./package.json').stage || ''")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "title=Moss ${stage:+$stage }$version" >> "$GITHUB_OUTPUT"
          echo "Version $version ($stage)"

      - id: check
        name: Create the draft release, unless this version is out already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
          # Goes above the notes GitHub writes from the pull requests.
          INSTALL_NOTES: |
            **Installing.** Moss isn't signed with an Apple or Microsoft certificate yet, so the first open needs one extra step:
            - **macOS:** open the `.dmg` (Apple silicon: `aarch64`, Intel: `x64`) and drag Moss to Applications. If macOS says it can't be opened, go to System Settings → Privacy & Security and click **Open Anyway**.
            - **Windows:** run the `-setup.exe` (or `.msi`). If SmartScreen appears, click **More info → Run anyway**. The `_portable.exe` runs without installing, but doesn't update itself.
            - **Linux:** the `.AppImage` updates itself; `.deb` and `.rpm` don't.
            - **Android (early):** download the `.apk` on your phone or tablet and open it; allow installing from your browser if asked. To update, install the newer `.apk` over it. Sync with GitHub needs Git, so it isn't available on Android yet, and the layout is made for larger screens.

            Already on 0.1.2 or later? Moss updates itself: **Update to …** appears in the sidebar.
        run: |
          # A published release with this tag means nothing to do.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released. Bump the version on the release branch to ship a new one."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Leftover drafts for this version (a failed run) are replaced.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # Take the id from the reply: looking the new draft up in the release
          # list right away can come back empty, and then nothing gets uploaded.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$TITLE" \
            -F draft=true -F generate_release_notes=true -f body="$INSTALL_NOTES" --jq .id)
          if [ -z "$id" ]; then echo "Couldn't create the draft release"; exit 1; fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            # The oldest supported Ubuntu, so the .deb and AppImage run on more systems.
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-targets }}

      - name: Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      # In-app updates: with the signing key in the repo's secrets, the build
      # also makes signed update files, and tauri-action uploads a latest.json
      # that lists them. The app reads that file to find new versions (see
      # src/platform/updates.ts). Without the key, the release still builds, just
      # without update files.
      - name: Turn on update files if the signing key is set
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "UPDATER_ARGS=--config ${{ github.workspace }}/src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret: building without update files."
          fi

      # Builds the front end and the app, bundles installers (.dmg, .msi/.exe,
      # .deb/.rpm/.AppImage) and uploads them to the draft made above.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public id of Moss's GitHub OAuth app (device flow on), for Settings → Sync.
          # A repository variable, not a secret. Without it, sign-in is off.
          MOSS_GITHUB_CLIENT_ID: ${{ vars.MOSS_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

      # The Mac app is signed "ad hoc" (signingIdentity "-" in tauri.conf.json):
      # not a Developer ID, but enough that macOS offers "Open Anyway" instead
      # of calling the download damaged. Check it really is signed; a failure
      # here keeps the release a draft.
      - name: Check the Mac app is signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d target/*/release/bundle/macos/Moss.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"

      # Windows also gets a portable .exe: the app on its own, no installer.
      # (It needs WebView2, which Windows 10 and 11 already have; the example
      # data is built into the app, so nothing else has to sit beside it.)
      # Not essential, so a hiccup here doesn't hold up the release.
      - name: Portable Windows .exe
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          exe=$(ls target/release/moss.exe target/release/Moss.exe 2>/dev/null | head -1)
          if [ -z "$exe" ]; then echo "No app .exe found in target/release"; ls target/release; exit 1; fi
          name="Moss_${version}_x64_portable.exe"
          cp "$exe" "$name"
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$name" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name"

  android:
    name: Build (Android)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java, the Android SDK and NDK, and the generated Android project.
      - uses: ./.github/actions/android-project

      # One APK for 64-bit and 32-bit ARM phones and tablets.
      - name: Build the APK
        env:
          MOSS_GITHUB_CLIENT_ID: ${{ vars.MOSS_GITHUB_CLIENT_ID }}
        run: pnpm tauri android build --apk --target aarch64 armv7

      # Android only installs signed APKs, and only lets a new version
      # replace an installed one when both are signed with the same key. So
      # the key is kept in the repo's secrets:
      #   ANDROID_KEYSTORE           the .jks file, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD  its password (also used for the key)
      #   ANDROID_KEY_ALIAS          the key's name inside it
      # Without them, the APK is signed with a key made just for this build:
      # it installs, but the next version can't update it in place, and the
      # release notes say so.
      - name: Sign the APK and add it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          unsigned=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          if [ -z "$unsigned" ]; then echo "No release APK found"; find src-tauri/gen/android -name '*.apk'; exit 1; fi

          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/moss.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a one-off key. The next version won't install over this one."
            KS_PASS=$(openssl rand -hex 16)
            KEY_ALIAS=moss
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/moss.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Moss"
            note=$'\n\n**Android:** this APK is signed with a key made just for this release, so the next version can\'t install over it. Before installing a later version, export or copy anything you want to keep, then uninstall this one.'
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f body="$body$note" > /dev/null
          fi
          export KS_PASS

          name="Moss_${version}_android.apk"
          "$ANDROID_BUILD_TOOLS/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/moss.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS --out "$name" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_BUILD_TOOLS/apksigner" verify "$name"

          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$name" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" > /dev/null

  publish:
    name: Publish the release
    needs: [prepare, build, android]
    # Waits for Android too, but only the desktop builds have to succeed:
    # Android is newer, and shouldn't keep Mac, Windows and Linux from shipping.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false
