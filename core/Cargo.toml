[package]
name = "task-core"
version = "0.3.1"
edition = "2021"
description = "Reads, validates and writes the task app's plain-markdown data folder."
publish = false

[dependencies]
# Dates and the current time ("created: 2026-10-16", Unsorted timestamps).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Random bytes for new item ids.
getrandom = "0.3"
# Lets the app send items to the UI as JSON.
serde = { version = "1", features = ["derive"] }
# Watching the data folder for changes made outside the app (phone, Finder, sync).
notify = "8"
# Talking to GitHub (sign in, list and create repos). Small and blocking: the
# app calls it from background threads.
ureq = { version = "3", features = ["json"] }
serde_json = "1"
# Sync without the `git` program (Android has none): files are compared by the
# same SHA-1 names Git gives them, and sent to GitHub as base64.
sha1 = "0.10"
base64 = "0.22"
# Backups are plain .zip files you can open with anything.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Throwaway folders for tests and the benchmark.
tempfile = "3"
