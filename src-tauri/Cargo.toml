[package]
name = "moss"
version = "0.1.2"
description = "Moss: tasks and notes, sorted into a strict hierarchy"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "moss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what allows a transparent window (needed for vibrancy).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
task-core = { path = "../core" }
tauri-plugin-macos-fps = "0.1.0"
